[package]
name = "essvb-reader"
version = "0.2.1"
description = "ESSVB-Reader - Guvenli, telemetrisiz, capraz platform EPUB, PDF, DOCX ve DOC okuyucu"
authors = ["ESSVB-Reader Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "essvb_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-essvb-tts = { path = "plugins/tauri-plugin-essvb-tts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
ammonia = "4.0"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "fs", "time", "process", "io-util"] }
async-trait = "0.1"
url = "2"
percent-encoding = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Media_SpeechSynthesis",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
