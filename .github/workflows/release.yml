name: Release (Windows 11, CachyOS/Arch, Android APK, iPadOS IPA & PWA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec tauri build --bundles "msi,nsis"

      - name: Package Windows installers and portable zip
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $pkgJson = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkgJson.version
          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" release-win -Force
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" release-win -Force

          $stage = Join-Path "release-win" "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri\target\release\essvb-reader.exe" (Join-Path $stage "essvb-reader.exe") -Force
          Set-Content -Path (Join-Path $stage "portable.txt") -Value "ESSVB-Reader Portable Mode Marker" -Encoding UTF8
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE") -Force
          Copy-Item "THIRD_PARTY_LICENSES.md" (Join-Path $stage "THIRD_PARTY_LICENSES.md") -Force
          Set-Content -Path (Join-Path $stage "README-PORTABLE.txt") -Value "ESSVB-Reader v$ver Portable Edition" -Encoding UTF8
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "release-win\ESSVB-Reader-$ver-windows-x64-portable.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: release-win/*

  build-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build AppImage
        env:
          NO_STRIP: "true"
        run: pnpm exec tauri build --bundles appimage

      - name: Collect AppImage
        run: |
          mkdir -p release-appimage
          cp -f src-tauri/target/release/bundle/appimage/*.AppImage release-appimage/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release-appimage/*

  build-cachyos-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch Linux build packages and pnpm 12
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust nodejs npm pnpm pkgconf webkit2gtk-4.1 gtk3 libsecret hicolor-icon-theme
          npm install -g --prefix /usr/local pnpm@12.15.0
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build Arch / CachyOS package via PKGBUILD
        run: |
          su - builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch' && makepkg -f --noconfirm"
          mkdir -p release-arch
          cp -f packaging/arch/*.pkg.tar.zst release-arch/
          cp -f packaging/arch/PKGBUILD release-arch/PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: cachyos-arch-pkg
          path: release-arch/*

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36 & NDK 27
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Initialize & build signed Android arm64 APK (Samsung Galaxy S21 FE)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/android
          pnpm exec tauri android init --ci
          pnpm exec tauri android build --apk --target aarch64 --ci

          RAW_APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "${RAW_APK}" ]; then
            echo "No APK found after tauri android build"
            exit 1
          fi

          mkdir -p release-android
          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          KEYSTORE_PATH="$RUNNER_TEMP/essvb-release.jks"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-essvbReaderKey2026}"
          KS_ALIAS="${ANDROID_KEY_ALIAS:-essvb}"

          if [ -n "${ANDROID_KEYSTORE_B64}" ]; then
            echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "$KEYSTORE_PATH"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=ESSVB-Reader, OU=OpenSource, O=ESSVB, C=TR"
          fi

          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          OUT_APK="release-android/ESSVB-Reader-${VER}-android-arm64.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED_APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:${KS_PASS}" \
            --key-pass "pass:${KS_PASS}" \
            --out "$OUT_APK" "$ALIGNED_APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$OUT_APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: release-android/*

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Initialize & build unsigned iPadOS/iOS .ipa (iPad 9th Gen AltStore/Sideloadly)
        run: |
          set -euo pipefail
          rm -rf src-tauri/gen/apple
          pnpm exec tauri ios init --ci

          for plist in src-tauri/gen/apple/*/Info.plist; do
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$plist"
            /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$plist"
          done

          cat > "$RUNNER_TEMP/unsigned.xcconfig" <<'EOF'
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          DEVELOPMENT_TEAM =
          TARGETED_DEVICE_FAMILY = 1,2
          EOF
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig"

          node -e '
            const fs = require("fs");
            const path = require("path");
            const appleDir = "src-tauri/gen/apple";
            const proj = fs.readdirSync(appleDir).find((f) => f.endsWith(".xcodeproj"));
            if (!proj) throw new Error("Missing .xcodeproj");
            const pbxPath = path.join(appleDir, proj, "project.pbxproj");
            let txt = fs.readFileSync(pbxPath, "utf8");
            txt = txt.replace(
              /^\s*(CODE_SIGN_IDENTITY(?:\[[^\]]*\])?|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|TARGETED_DEVICE_FAMILY)\s*=.*;\r?\n/gm,
              ""
            );
            txt = txt.replace(
              /(buildSettings\s*=\s*\{\r?\n)/g,
              "$1\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = \"\";\n\t\t\t\tTARGETED_DEVICE_FAMILY = \"1,2\";\n"
            );
            fs.writeFileSync(pbxPath, txt);
            console.log("Patched unsigned manual buildSettings in " + pbxPath);
          '

          # tauri ios build orchestrates cli-options-server + Rust + Swift, producing .app/.xcarchive
          # before code-signed exportArchive; ignore exportArchive signing error if unsigned .app is produced.
          if ! pnpm exec tauri ios build --ci; then
            echo "tauri ios build returned non-zero (expected during unsigned export); checking for built .app bundle..."
          fi

          APP_DIR="$(find src-tauri/gen/apple -type d -name '*.app' | head -n 1 || true)"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' -path '*iphoneos*' | head -n 1 || true)"
          fi
          if [ -z "$APP_DIR" ]; then
            echo "iOS .app bundle not found after tauri ios build"
            exit 1
          fi
          echo "Found built iOS .app bundle at: $APP_DIR"

          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          mkdir -p "$RUNNER_TEMP/ipa-stage/Payload" release-ios
          cp -R "$APP_DIR" "$RUNNER_TEMP/ipa-stage/Payload/"
          (cd "$RUNNER_TEMP/ipa-stage" && zip -r "${GITHUB_WORKSPACE}/release-ios/ESSVB-Reader-${VER}-ipad-ios-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ipados-unsigned-ipa
          path: release-ios/*

  build-pwa-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Package Offline PWA Bundle (iPad Safari / Self-host)
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          mkdir -p release-pwa
          (cd dist && zip -r "../release-pwa/ESSVB-Reader-${VER}-pwa-offline.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-offline-bundle
          path: release-pwa/*

  publish-release:
    needs:
      - build-windows
      - build-linux-appimage
      - build-cachyos-arch
      - build-android-apk
      - build-ios-ipa
      - build-pwa-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect assets, generate SHA256SUMS.txt & latest.json
        run: |
          mkdir -p final-assets
          find downloaded -type f -exec cp -f {} final-assets/ \;
          cd final-assets
          sha256sum * > SHA256SUMS.txt
          VER=$(node -p "JSON.parse(require('fs').readFileSync('../package.json','utf8')).version")
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v$VER"; fi
          export VER REPO TAG
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => f !== "SHA256SUMS.txt" && f !== "latest.json");
            const sums = {};
            for (const line of fs.readFileSync("SHA256SUMS.txt","utf8").trim().split("\n")) {
              const [hash, name] = line.trim().split(/\s+/);
              sums[name] = hash;
            }
            const base = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}`;
            const manifest = {
              version: process.env.VER,
              notes: "Windows 11 (.msi, -setup.exe, portable.zip), CachyOS/Arch Linux (.AppImage, .pkg.tar.zst), Android arm64 (.apk), iPadOS (.ipa) ve iPad Safari Offline PWA surumleri.",
              releasePageUrl: `https://github.com/${process.env.REPO}/releases/tag/${process.env.TAG}`,
              assets: files.map(name => ({
                name,
                downloadUrl: `${base}/${encodeURIComponent(name)}`,
                sizeBytes: fs.statSync(name).size,
                sha256: sums[name] || null,
              }))
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', '0.2.1') }}
          name: ESSVB-Reader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.1' }} (Windows 11, CachyOS, Android APK, iPadOS IPA & PWA)
          generate_release_notes: true
          prerelease: false
          files: final-assets/*
